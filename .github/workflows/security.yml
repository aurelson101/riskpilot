name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose run --rm backend composer validate --strict
      - run: docker compose run --rm backend php bin/console doctrine:migrations:migrate --dry-run --no-interaction
      - run: docker compose exec -T postgres sh -lc 'createdb -U "$POSTGRES_USER" "${POSTGRES_DB}_test"'
      - run: docker compose run --rm backend php bin/console lexik:jwt:generate-keypair --no-interaction
      - run: docker compose run --rm -e APP_ENV=test backend php bin/phpunit
      - run: docker compose run --rm backend vendor/bin/phpstan analyse src tests --memory-limit=512M
      - run: docker compose run --rm backend vendor/bin/php-cs-fixer check --diff
      - run: docker compose run --rm frontend npm run lint
      - run: docker compose run --rm frontend npm run test
      - run: docker compose run --rm frontend npm run i18n:audit
      - run: docker compose run --rm frontend npm run security:react-router
      - run: docker compose run --rm frontend npm run build
      - run: docker compose run --rm backend sh -lc 'php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --no-interaction --purge-with-truncate'
      - run: docker compose up -d --wait nginx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo chown -R "$USER":"$USER" frontend/node_modules
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: riskpilot-sbom.spdx.json
  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  container-scan:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build backend frontend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: riskpilot-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
